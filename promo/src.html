<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карьерный навигатор — motion</title>
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(data:font/woff2;base64,__FONT_LATIN__) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-weight:100 900;src:url(data:font/woff2;base64,__FONT_CYR__) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
html,body{margin:0;width:1440px;height:1440px;overflow:hidden;background:#EDEDF0}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;color:#1d1d1f;font-feature-settings:"cv11","ss01"}
#stage{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#shape{position:absolute;left:0;top:0;overflow:hidden;transform-origin:50% 50%;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -18px rgba(0,0,0,.16)}
.c{position:absolute;left:0;top:0;transform-origin:0 0;box-sizing:border-box}
.a{position:absolute}
svg{display:block;overflow:visible}
.ln{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
#cursor{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.22))}
.lab{font-size:24px;font-weight:600;color:#0071e3;letter-spacing:-.1px}
.h1{font-size:56px;font-weight:700;letter-spacing:-1.6px;line-height:1.08}
.sub{font-size:26px;color:#6e6e73;line-height:1.4;letter-spacing:-.1px}
.fl{font-size:23px;font-weight:600;letter-spacing:-.1px}
.inp{height:76px;border-radius:16px;background:#f5f5f7;box-sizing:border-box;padding:0 26px;display:flex;align-items:center;font-size:28px;white-space:pre;border:2px solid transparent}
.ph{color:#a1a1a6}
.pill{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:-.2px;box-sizing:border-box}
.pb{background:#0071e3;color:#fff}
.pg{background:#fff;color:#1d1d1f;border:2px solid #d2d2d7}
.chip{border-radius:16px;border:2px solid #d2d2d7;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500;box-sizing:border-box}
.caret{display:inline-block;width:3px;height:34px;border-radius:2px;background:#0071e3;margin-left:2px;vertical-align:middle}
.opt{position:absolute;left:72px;right:72px;height:100px;border-radius:22px;border:2px solid #e8e8ed;box-sizing:border-box;display:flex;align-items:center;font-size:29px;font-weight:500;letter-spacing:-.3px}
.radio{width:34px;height:34px;border-radius:50%;border:2.5px solid #c7c7cc;margin:0 26px 0 30px;box-sizing:border-box;position:relative;flex:none}
.radio i{position:absolute;inset:6px;border-radius:50%;background:#0071e3}
.card{position:absolute;left:72px;right:72px;height:196px;border-radius:28px;background:#f5f5f7;display:flex;align-items:center}
.ibox{width:112px;height:112px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 30px 0 28px;color:#0071e3;flex:none}
.bub{position:absolute;border-radius:30px;font-size:27px;line-height:1.42;padding:22px 28px;box-sizing:border-box;letter-spacing:-.2px}
</style>
</head>
<body>
<div id="stage"><div id="world"><div id="shape"></div></div></div>
<script src="__SCRIPT__"></script>
</body>
</html>
