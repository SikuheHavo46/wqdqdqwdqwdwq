#stage{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#shape{position:absolute;left:0;top:0;overflow:hidden;transform-origin:50% 50%;

.c{position:absolute;left:0;top:0;transform-origin:0 0;box-sizing:border-box}
.abs{position:absolute}
svg{display:block;overflow:visible}
.ln{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
#cursor{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.22))}
.row{position:absolute;left:16px;right:16px;height:104px;border-radius:22px;display:flex;align-items:center}
.ibox{width:64px;height:64px;border-radius:18px;background:#F1F0EE;display:flex;align-items:center;justify-content:center;margin-left:16px;color:#111}
